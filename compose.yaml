services:
  console:
    build: .
    image: kaggle-strata-console:local
    container_name: kaggle-strata-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STRATA_PORT:-18786}:8000"
    env_file:
      - .env
    environment:
      STRATA_DATA_DIR: /data
    volumes:
      - console-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  console-data:
